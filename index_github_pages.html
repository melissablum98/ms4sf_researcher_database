<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS4SF Climate & Health Research Mentors</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --navy: #0b3d5c; --blue: #176b87; --teal: #168b8b; --green: #2f7d4a;
            --light-blue: #eaf5f7; --light-green: #edf7ef; --border: #d8e4e8;
            --text: #24343d; --muted: #62737b; --white: #ffffff;
            --shadow: 0 10px 30px rgba(11, 61, 92, 0.12);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #e8f4f5 0%, #eef7f0 100%); min-height: 100vh; padding: 24px; color: var(--text); }
        .container { max-width: 1200px; margin: 0 auto; background: var(--white); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
        .header { background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 55%, var(--green) 100%); color: var(--white); padding: 34px 24px 38px; text-align: center; }
        .logo-wrap { min-height: 58px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; }
        .ms4sf-logo { max-height: 64px; max-width: min(320px, 82vw); width: auto; height: auto; object-fit: contain; background: rgba(255, 255, 255, 0.95); border-radius: 10px; padding: 6px 10px; }
        .header h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.15; margin-bottom: 10px; }
        .header p { font-size: 1.08rem; opacity: 0.96; }
        .stats { display: flex; justify-content: center; gap: 34px; margin-top: 22px; flex-wrap: wrap; font-size: 0.98rem; }
        .stat { display: flex; align-items: center; gap: 8px; }
        .stat-number { font-weight: 700; font-size: 1.28em; }
        .legend { margin: 18px auto 0; max-width: 700px; font-size: 0.9rem; opacity: 0.94; display: flex; justify-content: center; flex-wrap: wrap; gap: 16px; }
        .legend-item { display: inline-flex; align-items: center; gap: 6px; }
        .search-section { padding: 34px 20px; background: #f6fafb; border-bottom: 1px solid var(--border); }
        .search-box { max-width: 720px; margin: 0 auto; }
        .search-input { width: 100%; padding: 15px 18px; font-size: 1rem; border: 2px solid var(--border); border-radius: 10px; background: var(--white); color: var(--text); transition: border-color 0.2s, box-shadow 0.2s; margin-bottom: 16px; }
        .search-input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 4px rgba(22, 139, 139, 0.12); }
        .search-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; }
        .search-type, .filter-options { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .search-type label, .filter-options label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.95rem; color: var(--text); }
        input[type="radio"], input[type="checkbox"] { accent-color: var(--teal); cursor: pointer; }
        .results-section { padding: 36px 20px 42px; }
        .loading { display: none; text-align: center; padding: 24px; color: var(--blue); }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(23, 107, 135, 0.18); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .results-info { margin-bottom: 20px; color: var(--muted); font-size: 0.95rem; }
        .results-list { display: grid; gap: 16px; }
        .mentor-card { border: 1px solid var(--border); border-left: 5px solid var(--teal); border-radius: 12px; padding: 20px; background: var(--white); transition: transform 0.18s, box-shadow 0.18s; }
        .mentor-card:hover { box-shadow: 0 10px 24px rgba(11, 61, 92, 0.10); transform: translateY(-2px); }
        .mentor-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
        .mentor-name { font-size: 1.2rem; font-weight: 700; color: var(--navy); }
        .badges { display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0; }
        .badge { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; font-size: 1rem; line-height: 1; background: var(--light-blue); border: 1px solid var(--border); }
        .badge-ms4sf { background: var(--light-green); border-color: #c8e3cf; }
        .badge-mentor { background: #fff7df; border-color: #ead7a5; }
        .mentor-info { display: grid; gap: 14px; color: var(--muted); font-size: 0.95rem; }
        .info-item { display: flex; flex-direction: column; gap: 5px; }
        .info-label { font-weight: 700; color: var(--blue); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-value { line-height: 1.55; overflow-wrap: anywhere; }
        .email-link { color: var(--blue); text-decoration: none; font-weight: 600; }
        .email-link:hover { text-decoration: underline; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 4px; }
        .tag { display: inline-block; background: var(--light-blue); color: var(--navy); padding: 5px 10px; border-radius: 16px; font-size: 0.83rem; border: 1px solid #d3e9ed; }
        .keyword-more-btn { border: 1px solid #b9d8dd; background: #f2fafb; color: var(--blue); padding: 5px 10px; border-radius: 16px; font-size: 0.83rem; font-weight: 700; cursor: pointer; }
        .keyword-more-btn:hover { background: #e6f4f6; }
        .no-results { text-align: center; padding: 44px 20px; color: #8a999f; }
        .no-results p:first-child { font-size: 1.08rem; margin-bottom: 8px; }
        .error-message { text-align: center; padding: 24px; color: #a33a3a; background: #fff4f4; border: 1px solid #eccaca; border-radius: 10px; }
        .footer { padding: 20px; background: #f6fafb; text-align: center; color: #7f8f96; font-size: 0.9rem; border-top: 1px solid var(--border); }
        @media (max-width: 768px) { body { padding: 10px; } .search-controls { grid-template-columns: 1fr; } .search-type, .filter-options { justify-content: flex-start; } .mentor-title-row { align-items: flex-start; } }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo-wrap">
                <img id="ms4sf-logo" class="ms4sf-logo" src="./static/ms4sf_logo.png" alt="MS4SF logo" onerror="this.style.display='none';">
            </div>
            <h1>🔬 Research Mentors Directory</h1>
            <p>Find climate and health researchers and mentors</p>
            <div class="stats">
                <div class="stat"><span>👥</span><span><span class="stat-number" id="total-mentors">0</span> Researchers</span></div>
                <div class="stat"><span>✉️</span><span><span class="stat-number" id="mentors-with-email">0</span> With Email</span></div>
            </div>
            <div class="legend">
                <span class="legend-item"><span>🌎</span> Current or former MS4SF member</span>
                <span class="legend-item"><span>★</span> Mentorship form completed</span>
            </div>
        </header>

        <section class="search-section">
            <div class="search-box">
                <input type="text" id="search-input" class="search-input" placeholder="Search by researcher name, institution, or research topic..." autocomplete="off">
                <div class="search-controls">
                    <div class="search-type">
                        <label><input type="radio" name="search-type" value="all" checked> All</label>
                        <label><input type="radio" name="search-type" value="name"> Name</label>
                        <label><input type="radio" name="search-type" value="institution"> Institution</label>
                        <label><input type="radio" name="search-type" value="keywords"> Keywords</label>
                    </div>
                    <div class="filter-options">
                        <label><input type="checkbox" id="email-filter"> Show only researchers with email</label>
                    </div>
                </div>
            </div>
        </section>

        <main class="results-section">
            <div class="loading" id="loading"><span class="spinner"></span>Loading mentor database...</div>
            <div class="results-info" id="results-info"></div>
            <div class="results-list" id="results-list"></div>
        </main>

        <footer class="footer">
            <p>Research mentor database for students and researchers interested in climate and health</p>
        </footer>
    </div>

    <script>
        let allMentors = [];

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function truthyFlag(value) {
            if (typeof value === 'boolean') return value;
            if (typeof value === 'number') return value === 1;
            return ['true', 'yes', 'y', '1', '1.0', 'x'].includes(String(value ?? '').trim().toLowerCase());
        }

        async function loadData() {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            try {
                const response = await fetch('./mentors_data.json', { cache: 'no-store' });
                if (!response.ok) throw new Error(`Failed to load mentors_data.json: HTTP ${response.status}`);
                const data = await response.json();
                allMentors = Array.isArray(data.mentors) ? data.mentors : [];
                document.getElementById('total-mentors').textContent = Number(data.total_mentors || allMentors.length).toLocaleString();
                const emailCount = Number(data.mentors_with_email ?? allMentors.filter(m => Array.isArray(m.emails) && m.emails.length > 0).length);
                document.getElementById('mentors-with-email').textContent = emailCount.toLocaleString();
                console.log(`Loaded ${allMentors.length} researchers`);
            } catch (error) {
                console.error('Error loading mentor database:', error);
                document.getElementById('results-info').innerHTML = '<div class="error-message"><strong>Error loading mentor database.</strong><br>Please refresh the page and try again.</div>';
            } finally {
                loading.style.display = 'none';
            }
        }

        function searchMentors(query, searchType, emailOnly) {
            if (!query.trim()) return [];
            const queryLower = query.toLowerCase().trim();
            return allMentors.filter(mentor => {
                let matches = false;
                const name = String(mentor.name || '').toLowerCase();
                const affiliations = Array.isArray(mentor.affiliations) ? mentor.affiliations : [];
                const keywords = Array.isArray(mentor.keywords) ? mentor.keywords : [];
                const emails = Array.isArray(mentor.emails) ? mentor.emails : [];
                if (searchType === 'name' || searchType === 'all') {
                    if (name.includes(queryLower)) matches = true;
                }
                if (searchType === 'institution' || (searchType === 'all' && !matches)) {
                    if (affiliations.some(a => String(a).toLowerCase().includes(queryLower))) matches = true;
                }
                if (searchType === 'keywords' || (searchType === 'all' && !matches)) {
                    if (keywords.some(k => String(k).toLowerCase().includes(queryLower))) matches = true;
                }
                if (emailOnly && emails.length === 0) return false;
                return matches;
            });
        }

        function createEmailHtml(emails) {
            if (!emails.length) {
                return '<div class="info-item"><div class="info-label">📧 Email</div><div class="info-value" style="color:#aab5ba;">Not available</div></div>';
            }
            return '<div class="info-item"><div class="info-label">📧 Email</div><div class="info-value">' +
                emails.map(email => `<a href="mailto:${encodeURIComponent(email)}" class="email-link">${escapeHtml(email)}</a>`).join('; ') +
                '</div></div>';
        }

        function renderKeywords(keywords, cardId) {
            if (!keywords.length) return '';
            const visibleCount = 8;
            const visibleKeywords = keywords.slice(0, visibleCount);
            const hiddenKeywords = keywords.slice(visibleCount);
            const visibleHtml = visibleKeywords.map(k => `<span class="tag">${escapeHtml(k)}</span>`).join('');
            if (!hiddenKeywords.length) {
                return `<div class="info-item"><div class="info-label">🔬 Research Topics</div><div class="tag-list">${visibleHtml}</div></div>`;
            }
            const hiddenHtml = hiddenKeywords.map(k => `<span class="tag">${escapeHtml(k)}</span>`).join('');
            return `
                <div class="info-item">
                    <div class="info-label">🔬 Research Topics</div>
                    <div class="tag-list">
                        ${visibleHtml}
                        <button type="button" class="keyword-more-btn" onclick="toggleKeywords('${cardId}')" aria-expanded="false" aria-controls="keywords-hidden-${cardId}">+${hiddenKeywords.length}</button>
                    </div>
                    <div class="tag-list" id="keywords-hidden-${cardId}" style="display:none;">${hiddenHtml}</div>
                </div>`;
        }

        function toggleKeywords(cardId) {
            const hidden = document.getElementById(`keywords-hidden-${cardId}`);
            const button = document.querySelector(`button[aria-controls="keywords-hidden-${cardId}"]`);
            if (!hidden || !button) return;
            const isHidden = hidden.style.display === 'none';
            hidden.style.display = isHidden ? 'flex' : 'none';
            button.setAttribute('aria-expanded', String(isHidden));
            button.textContent = isHidden ? '−' : `+${hidden.querySelectorAll('.tag').length}`;
        }

        function renderResults(results) {
            const resultsList = document.getElementById('results-list');
            const resultsInfo = document.getElementById('results-info');
            if (results.length === 0) {
                resultsList.innerHTML = '<div class="no-results"><p>No researchers found matching your search.</p><p>Try a different search term or filter.</p></div>';
                resultsInfo.innerHTML = '';
                return;
            }
            resultsInfo.innerHTML = `<strong>${results.length}</strong> researcher${results.length !== 1 ? 's' : ''} found`;
            resultsList.innerHTML = results.map((mentor, index) => {
                const affiliations = Array.isArray(mentor.affiliations) ? mentor.affiliations : [];
                const emails = Array.isArray(mentor.emails) ? mentor.emails : [];
                const keywords = Array.isArray(mentor.keywords) ? mentor.keywords : [];
                const badges = [];
                if (truthyFlag(mentor.ms4sf_member)) badges.push('<span class="badge badge-ms4sf" title="Current or former MS4SF member" aria-label="MS4SF member">🌎</span>');
                if (truthyFlag(mentor.mentorship_form)) badges.push('<span class="badge badge-mentor" title="Mentorship form completed" aria-label="Mentorship form completed">★</span>');
                return `
                    <article class="mentor-card">
                        <div class="mentor-title-row">
                            <div class="mentor-name">${escapeHtml(mentor.name)}</div>
                            <div class="badges">${badges.join('')}</div>
                        </div>
                        <div class="mentor-info">
                            ${affiliations.length ? `<div class="info-item"><div class="info-label">🏫 Institutions</div><div class="info-value">${affiliations.map(escapeHtml).join('; ')}</div></div>` : ''}
                            ${createEmailHtml(emails)}
                            ${renderKeywords(keywords, `mentor-${index}`)}
                        </div>
                    </article>`;
            }).join('');
        }

        function performSearch() {
            const query = document.getElementById('search-input').value;
            const searchType = document.querySelector('input[name="search-type"]:checked').value;
            const emailOnly = document.getElementById('email-filter').checked;
            renderResults(searchMentors(query, searchType, emailOnly));
        }

        document.getElementById('search-input').addEventListener('input', performSearch);
        document.querySelectorAll('input[name="search-type"]').forEach(radio => radio.addEventListener('change', performSearch));
        document.getElementById('email-filter').addEventListener('change', performSearch);

        loadData();
    </script>
</body>
</html>
